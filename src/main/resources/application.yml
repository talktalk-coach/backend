spring:
  # profiles.active는 각 환경에서 직접 설정
  # 로컬: application-local.yml의 on-profile: local로 자동 적용
  # 배포(ECS): SPRING_PROFILES_ACTIVE 환경변수로 설정

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  # Jackson 날짜 직렬화 설정
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

  # 파일 업로드 제한
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  # OAuth2 소셜 로그인
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: dummy  # PKCE 비활성화용 더미값 (실제 Client Secret 없음)
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: account_email, profile_nickname, profile_image
            provider: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # Gmail SMTP 이메일 발송 설정
  mail:
    host: smtp.gmail.com      # 고정값 (환경변수 미사용)
    port: 587                 # 고정값
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# AWS S3
aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 604800000      # 7일 (ms)
  refresh-token-expiry: 1209600000    # 14일 (ms)

# Azure Speech API
azure:
  speech:
    key: ${AZURE_SPEECH_KEY}
    region: ${AZURE_SPEECH_REGION}

# OpenAI GPT API
openai:
  api:
    key: ${OPENAI_API_KEY}

# OAuth2 소셜 로그인 리다이렉트
# 로컬: http://localhost:3000/oauth2/callback
# 배포: 프론트 배포 URL로 변경
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}

# SpringDoc Swagger 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# 로깅
logging:
  level:
    com.codit.talktalkcoach: INFO
    org.hibernate.SQL: DEBUG
