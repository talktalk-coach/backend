spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env[.properties]   # .env 파일 자동 로딩

  datasource:
    url: ${DB_URL}   # .env의 RDS 전체 URL 사용
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

jwt:
  secret: local-dev-secret-key-must-be-at-least-32-characters-long
  access-token-expiry: 120960000
  refresh-token-expiry: 1209600000

azure:
  speech:
    key: ${AZURE_SPEECH_KEY:your-azure-key-here}
    region: koreacentral

openai:
  api:
    key: ${OPENAI_API_KEY:your-openai-key-here}  # IntelliJ 환경변수에서 주입

logging:
  level:
    com.codit.talktalkcoach: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
